# Glider's Top 10s (Movies and Series pages) and Top 15 trending (Home). Lives in
# RivaeStrategy/glider-download as .github/workflows/charts.yml (a public repo, so Actions cost
# nothing there), next to charts/top10.py and charts/trending.py. The copies in tuner-iptv's
# tools/charts are the ones to edit (also omdb.py). Needs the OMDB_KEY secret in that repo.
# charts/omdb-cache.json keeps OMDb's answers between runs; the job commits it with the charts.
name: Top 10 charts

on:
  schedule:
    # Tuesday afternoon, after Netflix posts the week's Top 10 (5 pm Eastern), and Friday
    # morning (6 am Eastern), which also catches a late Netflix week. Apple's chart is taken
    # as it stands at each run.
    - cron: "0 22 * * 2"
    - cron: "0 11 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: charts
  cancel-in-progress: false

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the charts
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: python3 charts/top10.py charts-ca.json
      - name: Save if they changed
        run: |
          git add charts-ca.json charts/omdb-cache.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git -c user.name="glider-charts" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Top 10 charts: $(date -u +%Y-%m-%d)"
          git push
